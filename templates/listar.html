{% extends 'base.html' %}
{% block conteudo %}
<section class="section-lista">
    <table class="table-clientes">
        <thead class="thead-clientes">
            <th>ID</th>
            <th>NOME</th>
            <th>CARGO</th>
            <th>SALÁRIO</th>
            <th>EDITAR</th>
            <th>EXCLUIR</th>
        </thead>
        <tbody class="tbody-clientes">
            {% for cliente in clientes %}
            <tr>
                <td>{{cliente.id_cliente}}</td>
                <td>{{cliente.nome_cliente}}</td>
                <td>{{cliente.cargo_cliente}}</td>
                <td>R${{cliente.salario_cliente}}</td>
                <td><form action="{{url_for('editar', id_cliente=cliente.id_cliente)}}" method="get"><button class="botao-editar" type="submit">✏️</button></form></td>
                <td><form action="{{url_for('excluir', id_cliente=cliente.id_cliente)}}" method="post"><button class="botao-editar" type="submit">❌</button></form></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock conteudo %}
